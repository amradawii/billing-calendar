services:
  app:
    build: .
    image: billing-calendar-app
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - vendor:/app/vendor
    depends_on:
      node:
        condition: service_completed_successfully

  node:
    image: node:18.12.0-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    command: sh -c "npm ci && npm run build"

volumes:
  vendor:
  node_modules:
